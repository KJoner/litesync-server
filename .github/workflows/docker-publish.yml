# Docker Hub 自动发布：仅由 v* 格式的 Git Tag 触发（普通 push / PR 走 ci.yml，不发布镜像）。
# 流程：测试（vet/test/build + tag↔版本号一致性）→ Buildx 多架构构建 → 登录 → 推送。
# 任一步骤失败整个 workflow 失败，绝不发布测试未通过的镜像。
name: Docker Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Git tag（去掉 v 前缀与 -rc 等预发布后缀）必须与代码内版本号一致，
      # 防止发布出 /api/v1/info 版本与镜像 tag 不符的镜像
      - name: Check tag matches server version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          CODE="$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/obsync/main.go)"
          if [ -z "$CODE" ] || [ "$BASE" != "$CODE" ]; then
            echo "Git tag v${TAG} 与 cmd/obsync/main.go 中的 version=\"${CODE}\" 不一致" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # v0.8.2 → 0.8.2 / 0.8 / 0 / latest；预发布 tag（如 v0.8.2-rc1）只生成
      # 0.8.2-rc1，不推进 0.8 / 0 / latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/litesync-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
