name: litesync

services:
  obsync:
    build: .
    restart: unless-stopped

    environment:
      # 在 .env 文件中设置 OBSYNC_TOKEN（参见 .env.example）
      OBSYNC_TOKEN: ${OBSYNC_TOKEN:?please set OBSYNC_TOKEN in .env}
      OBSYNC_DATA_DIR: /data
      OBSYNC_MAX_FILE_SIZE: ${OBSYNC_MAX_FILE_SIZE:-104857600}
      OBSYNC_LOG_LEVEL: ${OBSYNC_LOG_LEVEL:-info}

    volumes:
      - ./data:/data

    # 默认只监听 localhost，通过 Caddy / Nginx / Cloudflare Tunnel 暴露 HTTPS；
    # 绑定地址与宿主机端口可在 .env 中用 OBSYNC_BIND / OBSYNC_PORT 覆盖
    ports:
      - "${OBSYNC_BIND:-127.0.0.1}:${OBSYNC_PORT:-8080}:8080"

    # 日志轮转：防止 json-file 日志无限增长吃满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
